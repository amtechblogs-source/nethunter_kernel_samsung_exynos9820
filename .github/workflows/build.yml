name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev expect

    - name: Run Kernel Builder (Auto-Bot)
      run: |
        cd kali-nethunter-kernel-builder
        
        # Advance mein jawab de rahe hain taake script sawal na pooche
        cat << 'EOF' > local.config
        KERNEL_DIR=..
        DEFCONFIG=exynos9820_beyondx_defconfig
        EOF
        
        chmod +x build.sh
        
        # Hacker Trick: Expect Bot jo khud 'T' aur 'Enter' dabayega
        cat << 'EOF' > autobuild.exp
        set timeout -1
        spawn bash build.sh
        expect "K E R N E L   B U I L D E R"
        send "T\r"
        expect eof
        EOF
        
        expect autobuild.exp

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Fixed-OTG
        path: '**/*.zip'
