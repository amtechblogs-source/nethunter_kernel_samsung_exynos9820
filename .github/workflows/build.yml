name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev expect

    - name: Run Kernel Builder (Ultimate Auto-Bot)
      run: |
        cd kali-nethunter-kernel-builder
        chmod +x build.sh
        
        # Super Bot: Jo 3 sawalon ke jawab dega
        cat << 'EOF' > autobuild.exp
        set timeout -1
        spawn bash build.sh
        
        # Pehla Sawal: Build type? (T = Test build)
        expect "Enter selection"
        send "T\r"
        
        # Doosra Sawal: Device config? (6 = beyondx)
        expect "Please select the configuration"
        send "6\r"
        
        # Teesra Sawal (40 minute baad): Wapas menu aane par Exit (E)
        expect "Enter selection"
        send "E\r"
        
        expect eof
        EOF
        
        expect autobuild.exp

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Fixed-OTG
        path: '**/*.zip'
