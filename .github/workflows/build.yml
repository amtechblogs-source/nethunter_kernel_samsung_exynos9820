name: Build NetHunter Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev expect

    - name: Run Kernel Builder (Final Boss Mode)
      run: |
        # 1. Config file manually create kar di taake Q6 skip ho jaye
        cp arch/arm64/configs/exynos9820_beyondx_defconfig arch/arm64/configs/nethunter_defconfig
        
        cd kali-nethunter-kernel-builder
        chmod +x build.sh
        
        # 2. Smart Bot jo sirf Build aur Exit karega
        cat << 'EOF' > autobuild.exp
        set timeout -1
        spawn bash build.sh
        
        # Start: Main menu par 'T' dabao
        expect "Enter selection"
        send "T\r"
        
        # 40 Mins Later: Jab wapas Main menu aaye toh 'E' daba kar Exit karo
        expect "Enter selection"
        send "E\r"
        
        expect eof
        EOF
        
        expect autobuild.exp

    - name: Upload Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Fixed-OTG
        path: '**/*.zip'
