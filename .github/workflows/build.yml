name: Build NetHunter Kernel (Manual SSH + Error Logger)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32readline-dev lib32z1-dev liblz4-tool libncurses-dev libssl-dev libxml2 libxml2-utils lzop rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

    - name: SSH into Server (Tmate)
      uses: mxschmitt/action-tmate@v3

    - name: Upload Kernel Zip and Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-Files-And-Logs
        path: |
          **/*.zip
          **/build_error_log.txt
